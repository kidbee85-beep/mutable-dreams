name: One-time Mutable Dreams 1.4 source import
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download and verify prepared 1.4 files
        run: |
          curl --fail --location --retry 3 https://mutable-dreams.kidbee85.chatgpt.site/Mutable-Dreams-1.4-Repo-Overlay.zip --output /tmp/md14-overlay.zip
          printf '%s  %s\n' 'efa266129c74b3d2320f6311b67cbb9d08a243afc28ceeef810bc12a5b377c03' '/tmp/md14-overlay.zip' | sha256sum --check -
          unzip -tq /tmp/md14-overlay.zip
      - name: Import browsable source and release files
        run: |
          unzip -oq /tmp/md14-overlay.zip -d .
          printf '%s  %s\n' 'd6682e1433f581285333f23629be20b96a595707776c6359d22d14e6542d6bda' 'Mutable-Dreams-1.4.0.fwsc' | sha256sum --check -
          printf '%s  %s\n' '25ecf74cdcd490bdbbeb888ea415e514f55de4823aee8087152f4852b4688e39' 'Mutable-Dreams-1.4-Source.zip' | sha256sum --check -
          rm .github/workflows/import-mutable-dreams-1.4.yml
          git config user.name 'kidbee85-beep'
          git config user.email 'kidbee85@gmail.com'
          git add -A
          git commit -m 'Release Mutable Dreams 1.4 with expanded Biomes and per-track MIDI'
          git tag -a v1.4 -m 'Mutable Dreams 1.4'
          git push origin HEAD:main v1.4
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.4 Mutable-Dreams-1.4.0.fwsc Mutable-Dreams-1.4-Source.zip Mutable-Dreams-1.4.html Mutable-Dreams-1.4-Install.html Mutable-Dreams-1.4-Installer-Kit.zip Mutable-Dreams-1.4-Guide.pdf SHA256-1.4.txt --verify-tag --title 'Mutable Dreams 1.4 — A Wider Atlas' --notes-file Update-Notes-1.4.txt
