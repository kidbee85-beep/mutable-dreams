name = "Mutable-Dreams"
title = "Mutable Dreams"
author = "Kid Bunka"
tagline = "Living sound worlds for the M-VAVE FM-1"
description = "An open source FM-1 instrument for generative ambient music, rhythms and evolving soundscapes. Arrange freely assigned tracks, explore Biomes, shape synth voices and lo-fi kits, record sequences, and connect MIDI over USB, TRS or Bluetooth."
tags = ["synth", "groovebox", "sequencer", "sampler", "midi", "chords", "ambient", "generative"]
install = "https://mutable-dreams.sugarypixie10.chatgpt.site/"
site = "https://mutable-dreams.sugarypixie10.chatgpt.site/"
repo = "https://github.com/kidbee85-beep/mutable-dreams"
screenshot = "docs/img/screen-1.5.png"
credits = "Created by Kid Bunka; inspired by the open source work of Mutable Instruments, built with fm1-base and felucca-bsp. Independent from Mutable Instruments and M-VAVE."
id_prefix = "FM-1_710"
usb_manufacturer = "Mutable Dreams Project"
usb_product = "Mutable Dreams FM-1"
ble = true
ble_central = true
ble_stack = "own"
ble_pairing = true
ble_diag = false
ble_midi_time = false
backup = true
usb_audio_in = true
usb_audio_out = false
words = "words.tsv"
font_set = "dreams"
font_trim = true
font_pack = true
o2 = ["third_party/elements/dsp/exciter.cc", "third_party/elements/dsp/resonator.cc", "third_party/elements/resources.cc", "third_party/plaits/dsp/engine/additive_engine.cc", "dsp/dreams.cpp", "third_party/plaits/dsp/engine/fm_engine.cc", "third_party/plaits/dsp/engine/virtual_analog_engine.cc", "third_party/plaits/resources.cc", "third_party/rings/dsp/resonator.cc", "third_party/rings/resources.cc", "third_party/stmlib/dsp/units.cc", "third_party/stmlib/utils/random.cc"]
include = ["third_party"]
vendored = ["third_party/"]
# Optimize DSP loops without fast-math or changed floating-point contraction.
o2_cflags = ["-O3", "-DTEST", "-ffunction-sections", "-fdata-sections"]
licence = "GPL-3.0-only"

device_include = ["compat"]
